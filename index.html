<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Long Sans Variable Tester</title>
    <link rel="stylesheet" href="./style/main.css" />
  </head>
  <body>
    <button
      id="arduinoBtn"
      style="
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 999999;
        padding: 12px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      "
    >
      🔌 아두이노 연결
    </button>

    <div class="idle-screen" id="idleScreen">
      <div class="idle-content">
        <p class="wiggle-text">
          <span>G</span><span>a</span><span>e</span><span>g</span><span>i</span
          ><span>n</span> <span>S</span><span>a</span><span>n</span
          ><span>s</span>
        </p>
        <span>아무 키나 누르거나 마우스를 움직이세요</span>
      </div>
    </div>
    <div class="wrapper flow">
      <h1 class="title">Gaegin Sans</h1>

      <div class="preview-area">
        <textarea
          class="dynamic-input"
          id="textInput"
          rows="1"
          placeholder="글자를 입력하세요"
        ></textarea>
      </div>

      <div class="control-panel">
        <div class="control-title">Variable</div>

        <div class="slider-group">
          <div class="slider-label">Height</div>
          <div class="slider-wrapper">
            <!-- ID를 자바스크립트와 일치하도록 수정 -->
            <input type="range" id="heightSlider" min="0" max="100" value="0" />
          </div>
          <div class="slider-value" id="heightVal">0</div>
        </div>

        <div class="slider-group">
          <div class="slider-label">Middle</div>
          <div class="slider-wrapper">
            <!-- ID를 자바스크립트와 일치하도록 수정 -->
            <input
              type="range"
              id="middleSlider"
              min="0"
              max="100"
              value="50"
            />
          </div>
          <div class="slider-value" id="middleVal">50</div>
        </div>
      </div>
    </div>

    <!-- 햄버거 버튼과 사이드 메뉴 (스크립트가 읽을 수 있도록 상단에 배치 혹은 일치 확인) -->
    <!--<button class="menu-btn" id="menuBtn">
      <img src="/웹 소스/menu.svg" alt="menu" />
    </button>

    <nav class="side-menu" id="sideMenu">
      <ul>
        <li><a href="#about">서체 설명</a></li>
        <li><a href="#family">패밀리 구성</a></li>
        <li><a href="#spec">폰트 스펙</a></li>
        <li><a href="#graphic">폰트 그래픽</a></li>
      </ul>
    </nav>-->

    <!-- 모든 요소가 로드된 후 실행되도록 스크립트를 태그 하단에 하나로 통합 -->
    <script>
      // 1. 요소 가져오기 (HTML에 존재하는 ID와 완벽히 일치시킴)
      const textInput = document.getElementById("textInput");
      const heightSlider = document.getElementById("heightSlider");
      const middleSlider = document.getElementById("middleSlider");
      const heightVal = document.getElementById("heightVal");
      const middleVal = document.getElementById("middleVal");

      const menuBtn = document.getElementById("menuBtn");
      const sideMenu = document.getElementById("sideMenu");

      // 2. 폰트 스타일 업데이트 함수
      function updateStyles() {
        const hValue = heightSlider.value;
        const mValue = middleSlider.value;

        // 우측 숫자 변경
        heightVal.innerText = hValue;
        middleVal.innerText = mValue;

        // 가변 폰트 축 적용
        if (textInput) {
          textInput.style.fontVariationSettings = `"HGHT" ${hValue}, "MDLE" ${mValue}`;
        }
      }

      // 3. 입력창 자동 높이 조절
      if (textInput) {
        textInput.addEventListener("input", () => {
          textInput.style.height = "auto";
          textInput.style.height = textInput.scrollHeight + "px";
        });
      }

      // 4. 슬라이더 이벤트 리스너 연결
      if (heightSlider && middleSlider) {
        heightSlider.addEventListener("input", updateStyles);
        middleSlider.addEventListener("input", updateStyles);
      }

      // 5. [핵심] 햄버거 메뉴 토글 click 이벤트
      if (menuBtn && sideMenu) {
        menuBtn.addEventListener("click", () => {
          sideMenu.classList.toggle("open");
        });
      }
      // 6. 유휴 상태(Idle) 감지 및 잠자는 화면 제어
      let idleTimer = null;
      const IDLE_TIME_LIMIT = 300000; // 5분

      function showIdleScreen() {
        if (idleScreen) {
          idleScreen.classList.add("active");
        }
      }

      function resetIdleTimer() {
        if (idleScreen && idleScreen.classList.contains("active")) {
          idleScreen.classList.remove("active");
        }
        clearTimeout(idleTimer);
        idleTimer = setTimeout(showIdleScreen, IDLE_TIME_LIMIT);
      }

      const events = [
        "mousemove",
        "keydown",
        "mousedown",
        "touchstart",
        "scroll",
      ];
      events.forEach((eventName) => {
        window.addEventListener(eventName, resetIdleTimer);
      });

      // 초기 실행
      resetIdleTimer();

      // 최초 1회 실행 및 폰트 체크
      updateStyles();
      if (document.fonts && document.fonts.check) {
        document.fonts.check('16px "LongSans"');
      }

      const arduinoBtn = document.getElementById("arduinoBtn");

      let activePort = null;
      let isConnecting = false;

      // [1] 시리얼 읽기 및 자동 유지 로직
      async function startSerialRead(port) {
        if (isConnecting) return;
        isConnecting = true;
        activePort = port;

        try {
          // 포트가 닫혀있을 때만 open
          if (!port.readable) {
            await port.open({ baudRate: 115200 });
          }

          if (arduinoBtn) {
            arduinoBtn.innerText = "";
            arduinoBtn.style.background = "#ffffff";
            arduinoBtn.style.boxShadow = "none";
          }

          const textDecoder = new TextDecoderStream();
          port.readable.pipeTo(textDecoder.writable);
          const reader = textDecoder.readable.getReader();

          let buffer = "";
          isConnecting = false;

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += value;
            const lines = buffer.split("\n");
            buffer = lines.pop(); // 미완성 데이터 보관

            for (const line of lines) {
              const cleanLine = line.trim();
              if (cleanLine) {
                const [rawH, rawM] = cleanLine.split(",").map(Number);
                if (!isNaN(rawH) && !isNaN(rawM)) {
                  applyArduinoToSliders(rawH, rawM);

                  if (typeof resetIdleTimer === "function") {
                    resetIdleTimer();
                  }
                }
              }
            }
          }
        } catch (err) {
          console.error("통신 중단/에러:", err);
        } finally {
          isConnecting = false;
          activePort = null;
          if (arduinoBtn) {
            arduinoBtn.innerText = "🔌 연결 끊김 (자동 재연결 대기)";
            arduinoBtn.style.background = "#dc3545";
          }
        }
      }

      // [2] 승인된 아두이노 장치 찾아 연결하는 함수
      async function tryAutoConnect() {
        if (activePort || isConnecting || !("serial" in navigator)) return;

        try {
          const ports = await navigator.serial.getPorts();
          if (ports.length > 0) {
            console.log("등록된 아두이노 감지, 자동 연결 시도...");
            await startSerialRead(ports[0]);
          }
        } catch (err) {
          console.error("자동 연결 체크 오류:", err);
        }
      }

      // [3] 페이지 로드 시 즉시 자동 연결
      window.addEventListener("DOMContentLoaded", () => {
        tryAutoConnect();

        // [4] 5분(300,000ms)마다 연결 상태 점검 및 끊겼으면 자동 재연결
        // 테스트해보시려면 10000 (10초)으로 줄여서 확인해보세요!
        setInterval(
          () => {
            console.log("주기적 연결 상태 점검 중...");
            tryAutoConnect();
          },
          5 * 60 * 1000,
        );
      });

      // [5] 버튼 클릭 시 (최초 승인 등록용)
      if (arduinoBtn) {
        arduinoBtn.addEventListener("click", async () => {
          try {
            if (!("serial" in navigator)) {
              alert("이 브라우저는 Web Serial API를 지원하지 않습니다.");
              return;
            }

            const ports = await navigator.serial.getPorts();
            let port;

            if (ports.length > 0) {
              port = ports[0];
            } else {
              // 승인된 장치가 없으면 팝업창 띄움
              port = await navigator.serial.requestPort();
            }

            await startSerialRead(port);
          } catch (err) {
            console.error(err);
            alert("연결 실패: " + err.message);
          }
        });
      }

      // 필터용 배열 (함수 바깥 선언)
      let hValues = [];
      let mValues = [];
      const FILTER_SIZE = 5; // 떨림 방지용 필터 크기

      function applyArduinoToSliders(rawH, rawM) {
        if (!heightSlider || !middleSlider) return;

        // [1] 이미 0~100으로 들어오므로, 0 밑이나 100 위로 튀는 노이즈만 안전하게 제한
        let cleanH = Math.max(0, Math.min(100, rawH));
        let cleanM = Math.max(0, Math.min(100, rawM));

        // [2] 이동 평균 필터 (달달달 떨리는 노이즈 제거)
        hValues.push(cleanH);
        mValues.push(cleanM);
        if (hValues.length > FILTER_SIZE) hValues.shift();
        if (mValues.length > FILTER_SIZE) mValues.shift();

        const avgH = hValues.reduce((a, b) => a + b, 0) / hValues.length;
        const avgM = mValues.reduce((a, b) => a + b, 0) / mValues.length;

        // [3] 반올림하여 0~100 값을 슬라이더에 그대로 적용
        heightSlider.value = Math.round(avgH);
        middleSlider.value = Math.round(avgM);

        updateStyles();
      }
    </script>
  </body>
</html>
